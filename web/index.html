<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Image Segmentation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Image Segmentation App</h2>

  <input type="file" id="fileInput" accept="image/*"><br><br>

  <label for="segMethod">Segmentation Method:</label>
  <select id="segMethod">
    <option value="threshold">Fixed Threshold</option>
    <option value="otsu">Otsu</option>
    <option value="adaptiveMean">Adaptive Mean</option>
  </select>

  <div id="thresholdSection" style="margin-top: 10px;">
    <label>Threshold:</label>
    <input type="range" min="0" max="255" value="127" id="threshold">
    <input type="number" min="0" max="255" value="127" id="thresholdInput">
  </div>

  <button id="runButton">Segment</button>

  <h5>Original Image</h5>
  <img id="preview" class="preview-img">

  <h5>Grayscale Image</h5>
  <img id="grayscaledPreview" class="preview-img">

  <h5>Binary Image</h5>
  <img id="binaryPreview" class="preview-img">

  <h5>Segmented with Bounding Boxes</h5>
  <img id="processedPreview" class="preview-img">

  <h6 id="calculatedThresholdLabel" style="display:none;">Info:</h6>
  <span id="calculatedThreshold" style="display:none;"></span>

  <script type="text/javascript" src="/eel.js"></script>
  <script src="script.js"></script>
</body>
</html>
